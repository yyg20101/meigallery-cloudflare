# MeiGallery API Worker
name = "meigallery-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "meigallery-db"
database_id = ""
migrations_dir = "db/migrations"

# R2 存储桶
[[r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media"

# 环境变量
[vars]
APP_ENV = "production"
