queue = "meigallery-app-data-rights-export-dev"

[[env.dev.queues.consumers]]
queue = "meigallery-app-data-rights-export-dev"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 15
max_concurrency = 1
dead_letter_queue = "meigallery-app-data-rights-export-dev-dlq"

[[env.dev.queues.producers]]
binding = "DATA_RIGHTS_DELETION_QUEUE"
queue = "meigallery-app-data-rights-deletion-dev"

[[env.dev.queues.consumers]]
queue = "meigallery-app-data-rights-deletion-dev"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 15
max_concurrency = 1
dead_letter_queue = "meigallery-app-data-rights-deletion-dev-dlq"

[[env.dev.queues.producers]]
binding = "TELEGRAM_IMPORT_QUEUE"
queue = "meigallery-import-telegram-dev"

[[env.dev.queues.consumers]]
queue = "meigallery-import-telegram-dev"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
