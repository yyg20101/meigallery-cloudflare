# MeiGallery API Worker
name = "meigallery-api"
main = "src/index.ts"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# 自定义域名（Cloudflare Workers Custom Domains）
routes = [
  { pattern = "api.616618.xyz", custom_domain = true }
]

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "meigallery-db"
database_id = "714929cb-003b-4cb1-bd9f-545fa1895e8c"
migrations_dir = "migrations"

# R2 存储桶
[[r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media"

# Email Service（发送事务性邮件）
[[send_email]]
name = "EMAIL"

# Cron Trigger（定时任务）
[triggers]
crons = ["*/15 * * * *"]

[[queues.producers]]
binding = "AD_META_QUEUE"
queue = "meigallery-ad-meta"

[[queues.consumers]]
queue = "meigallery-ad-meta"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "meigallery-ad-meta-dlq"

[[queues.consumers]]
queue = "meigallery-ad-meta-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "AD_TIKTOK_QUEUE"
queue = "meigallery-ad-tiktok"

[[queues.consumers]]
queue = "meigallery-ad-tiktok"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "meigallery-ad-tiktok-dlq"

[[queues.consumers]]
queue = "meigallery-ad-tiktok-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "AD_GOOGLE_QUEUE"
queue = "meigallery-ad-google"

[[queues.consumers]]
queue = "meigallery-ad-google"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "meigallery-ad-google-dlq"

[[queues.consumers]]
queue = "meigallery-ad-google-dlq"
max_batch_size = 10
max_batch_timeout = 5

# 业务 Queue 使用单消息批次与有界并发；业务状态机负责幂等、租约和终态收敛，
# DLQ 仅保留平台级未交付消息供诊断，不绑定自动消费者。
[[queues.producers]]
binding = "IMPORT_QUEUE"
queue = "meigallery-import-zip"

[[queues.consumers]]
queue = "meigallery-import-zip"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 15
max_concurrency = 1
dead_letter_queue = "meigallery-import-zip-dlq"

[[queues.producers]]
binding = "DATA_RIGHTS_EXPORT_QUEUE"
queue = "meigallery-app-data-rights-export"

[[queues.consumers]]
queue = "meigallery-app-data-rights-export"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 15
max_concurrency = 1
dead_letter_queue = "meigallery-app-data-rights-export-dlq"

[[queues.producers]]
binding = "DATA_RIGHTS_DELETION_QUEUE"
queue = "meigallery-app-data-rights-deletion"

[[queues.consumers]]
queue = "meigallery-app-data-rights-deletion"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 15
max_concurrency = 1
dead_letter_queue = "meigallery-app-data-rights-deletion-dlq"

[[queues.producers]]
binding = "TELEGRAM_IMPORT_QUEUE"
queue = "meigallery-import-telegram"

[[queues.consumers]]
queue = "meigallery-import-telegram"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
max_concurrency = 1
dead_letter_queue = "meigallery-import-telegram-dlq"

[[durable_objects.bindings]]
name = "APP_REALTIME_HUB"
class_name = "AppRealtimeHub"

[exports.AppRealtimeHub]
type = "durable-object"
storage = "sqlite"

# 环境变量（非敏感）— 生产默认值
[vars]
APP_ENV = "production"
CORS_ORIGIN = "https://616618.xyz,https://www.616618.xyz"
EMAIL_FROM = "noreply@616618.xyz"
SITE_URL = "https://616618.xyz"
IMAGE_RESIZING_ENABLED = "true"
IMPORT_TOKEN_DAILY_LIMIT = "100"
APP_AUTH_ENABLED = "false"
APP_AUTH_REGISTRATION_ENABLED = "false"
APP_MEMBERSHIP_ENABLED = "false"
APP_MEMBERSHIP_ADMIN_ENABLED = "false"
APP_MEMBERSHIP_APPLICATIONS_ENABLED = "false"
APP_MEMBERSHIP_CATALOG_VERSION = "amc_app_1_0_draft_1"
APP_MEMBERSHIP_PRODUCTION_READY = "false"
APP_MESSAGING_ENABLED = "false"
APP_MESSAGING_ADMIN_ENABLED = "false"
APP_MESSAGING_DISCLOSURE_VERSION = "managed_message_1"
APP_MESSAGING_PRODUCTION_READY = "false"
APP_SAFETY_ENABLED = "false"
APP_SAFETY_ADMIN_ENABLED = "false"
APP_SAFETY_REASON_CATALOG_VERSION = "src_app_1_0_message_2_dev_1"
APP_SAFETY_PRODUCTION_READY = "false"
APP_SAFETY_APPEALS_ENABLED = "false"
APP_SAFETY_APPEALS_ADMIN_ENABLED = "false"
APP_SAFETY_APPEAL_POLICY_VERSION = "sap_app_1_0_safety_2_dev_1"
APP_SAFETY_APPEALS_PRODUCTION_READY = "false"
APP_NOTIFICATIONS_ENABLED = "false"
APP_NOTIFICATIONS_ADMIN_ENABLED = "false"
APP_NOTIFICATIONS_POLICY_VERSION = "ntp_app_1_0_message_3_dev_1"
APP_NOTIFICATIONS_PRODUCTION_READY = "false"
APP_WALLET_ENABLED = "false"
APP_WALLET_ADMIN_ENABLED = "false"
APP_WALLET_POLICY_VERSION = "wlp_app_1_0_wallet_1_dev_1"
APP_WALLET_PRODUCTION_READY = "false"
APP_REALTIME_ENABLED = "false"
APP_REALTIME_POLICY_VERSION = "rtp_app_1_0_message_4_dev_1"
APP_REALTIME_PRODUCTION_READY = "false"

[observability]
enabled = true
head_sampling_rate = 0.05

[env.dev]
name = "meigallery-api-dev"
workers_dev = true
routes = []

[env.dev.observability]
enabled = true
head_sampling_rate = 0.1

[[env.dev.d1_databases]]
binding = "DB"
database_name = "meigallery-db-dev"
database_id = "9ff61317-0c62-491b-8b29-e0d119f306c9"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media-dev"

[[env.dev.send_email]]
