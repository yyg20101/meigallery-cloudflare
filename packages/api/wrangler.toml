# MeiGallery API Worker
name = "meigallery-api"
main = "src/index.ts"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# 自定义域名（Cloudflare Workers Custom Domains）
routes = [
  { pattern = "api.616618.xyz", custom_domain = true }
]

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "meigallery-db"
database_id = "714929cb-003b-4cb1-bd9f-545fa1895e8c"
migrations_dir = "migrations"

# R2 存储桶
[[r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media"

# Email Service（发送事务性邮件）
[[send_email]]
name = "EMAIL"

# Cron Trigger（定时任务）
[triggers]
crons = ["*/15 * * * *"]

[[queues.producers]]
binding = "AD_META_QUEUE"
queue = "meigallery-ad-meta"

[[queues.consumers]]
queue = "meigallery-ad-meta"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "meigallery-ad-meta-dlq"

[[queues.consumers]]
queue = "meigallery-ad-meta-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "AD_TIKTOK_QUEUE"
queue = "meigallery-ad-tiktok"

[[queues.consumers]]
queue = "meigallery-ad-tiktok"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "meigallery-ad-tiktok-dlq"

[[queues.consumers]]
queue = "meigallery-ad-tiktok-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "AD_GOOGLE_QUEUE"
queue = "meigallery-ad-google"

[[queues.consumers]]
queue = "meigallery-ad-google"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60
dead_letter_queue = "meigallery-ad-google-dlq"

[[queues.consumers]]
queue = "meigallery-ad-google-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[workflows]]
binding = "AD_PLATFORM_VERIFICATION_WORKFLOW"
name = "meigallery-ad-platform-verification"
class_name = "AdPlatformVerificationWorkflow"

# 环境变量（非敏感）— 生产默认值
[vars]
APP_ENV = "production"
CORS_ORIGIN = "https://616618.xyz,https://www.616618.xyz"
EMAIL_FROM = "noreply@616618.xyz"
SITE_URL = "https://616618.xyz"
IMAGE_RESIZING_ENABLED = "true"
IMPORT_TOKEN_DAILY_LIMIT = "100"

[observability]
enabled = true
head_sampling_rate = 0.05

[env.dev]
name = "meigallery-api-dev"
workers_dev = true
routes = []

[env.dev.observability]
enabled = true
head_sampling_rate = 0.1

[[env.dev.d1_databases]]
binding = "DB"
database_name = "meigallery-db-dev"
database_id = "9ff61317-0c62-491b-8b29-e0d119f306c9"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media-dev"

[[env.dev.send_email]]
name = "EMAIL"

[env.dev.triggers]
crons = []

[env.dev.queues]
producers = []
consumers = []

[[env.dev.workflows]]
binding = "AD_PLATFORM_VERIFICATION_WORKFLOW"
name = "meigallery-ad-platform-verification-dev"
class_name = "AdPlatformVerificationWorkflow"

[env.dev.vars]
APP_ENV = "dev"
CORS_ORIGIN = ""
EMAIL_FROM = "noreply@616618.xyz"
SITE_URL = ""
IMAGE_RESIZING_ENABLED = "false"
IMPORT_TOKEN_DAILY_LIMIT = "100"

# 敏感变量需通过 wrangler secret put 设置：
# corepack pnpm --filter @meigallery/api exec wrangler secret put SESSION_SECRET
# corepack pnpm --filter @meigallery/api exec wrangler secret put TURNSTILE_SECRET_KEY
# corepack pnpm --filter @meigallery/api exec wrangler secret put STREAM_ACCOUNT_ID
# corepack pnpm --filter @meigallery/api exec wrangler secret put STREAM_API_TOKEN
# corepack pnpm --filter @meigallery/api exec wrangler secret put TELEGRAM_BOT_TOKEN_OPS_GALLERY_BOT
# sourceBotKey=ops_case_bot 时：
# corepack pnpm --filter @meigallery/api exec wrangler secret put TELEGRAM_BOT_TOKEN_OPS_CASE_BOT
# 通用广告平台凭证加密主密钥（production 必填）：
# corepack pnpm --filter @meigallery/api exec wrangler secret put AD_PLATFORM_CREDENTIAL_MASTER_KEY_CURRENT --env=""
# 仅密钥轮换窗口配置：
# corepack pnpm --filter @meigallery/api exec wrangler secret put AD_PLATFORM_CREDENTIAL_MASTER_KEY_PREVIOUS --env=""
