# MeiGallery API Worker
name = "meigallery-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "meigallery-db"
database_id = "714929cb-003b-4cb1-bd9f-545fa1895e8c"
migrations_dir = "migrations"

# R2 存储桶
[[r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media"

# 环境变量（非敏感）— 生产默认值
[vars]
APP_ENV = "production"
CORS_ORIGIN = "https://616618.xyz"

# 敏感变量需通过 wrangler secret put 设置：
# wrangler secret put SESSION_SECRET
# wrangler secret put TURNSTILE_SECRET_KEY
# wrangler secret put STREAM_ACCOUNT_ID
# wrangler secret put STREAM_API_TOKEN

# ─── 开发环境 ───
[env.dev]
name = "meigallery-api-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "meigallery-db-dev"
database_id = "65419d75-0b2e-40b6-b077-6e13616f2d18"  # dev 环境

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media-dev"

[env.dev.vars]
APP_ENV = "development"
CORS_ORIGIN = "*"  # 部署后替换为实际 workers.dev URL
