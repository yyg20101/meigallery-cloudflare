# MeiGallery 前端 Worker
name = "meigallery-web"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"

[vars]
NUXT_PUBLIC_APP_ENV = "production"
NUXT_PUBLIC_API_BASE_URL = "https://meigallery-api.250770503.workers.dev"

# ─── 开发环境 ───
[env.dev]
name = "meigallery-web-dev"

[env.dev.assets]
directory = ".output/public"

[env.dev.vars]
NUXT_PUBLIC_APP_ENV = "development"
NUXT_PUBLIC_API_BASE_URL = "https://meigallery-api-dev.workers.dev"  # 部署后替换为实际 URL
