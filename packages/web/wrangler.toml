# MeiGallery 前端 Worker
name = "meigallery-web"
main = ".output/server/index.mjs"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# 自定义域名（Cloudflare Workers Custom Domains）
routes = [
  { pattern = "616618.xyz", custom_domain = true },
  { pattern = "www.616618.xyz", custom_domain = true }
]

[assets]
directory = ".output/public"

# Service Binding：SSR 期间通过 Service Binding 直连 API Worker
# 避免同账户 *.workers.dev 域名互访限制（error 1042）
[[services]]
binding = "API_SERVICE"
service = "meigallery-api"

[vars]
NUXT_PUBLIC_APP_ENV = "production"
NUXT_PUBLIC_API_BASE_URL = "https://api.616618.xyz"
NUXT_PUBLIC_ATTRIBUTION_BASE_URL = "https://track.616618.xyz"
NUXT_PUBLIC_SITE_URL = "https://616618.xyz"
# Turnstile site key（公开值，在 Cloudflare Dashboard 创建 Turnstile widget 后填入）
# 留空则前端跳过人机验证
NUXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADGbuWKJvOkDMRWU"

[observability]
enabled = true
head_sampling_rate = 0.05

[env.dev]
name = "meigallery-web-dev"
workers_dev = true
routes = []

[env.dev.observability]
enabled = true
head_sampling_rate = 0.1

[env.dev.assets]
directory = ".output/public"

[[env.dev.services]]
binding = "API_SERVICE"
service = "meigallery-api-dev"

[env.dev.vars]
NUXT_PUBLIC_APP_ENV = "dev"
NUXT_PUBLIC_API_BASE_URL = "https://meigallery-api-dev.wajie.workers.dev"
NUXT_PUBLIC_ATTRIBUTION_BASE_URL = "https://meigallery-attribution-dev.wajie.workers.dev"
NUXT_PUBLIC_SITE_URL = "https://meigallery-web-dev.wajie.workers.dev"
NUXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADGbuWKJvOkDMRWU"
