# MeiGallery 前端 Worker
name = "meigallery-web"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"

# Service Binding：SSR 期间通过 Service Binding 直连 API Worker
# 避免同账户 *.workers.dev 域名互访限制（error 1042）
[[services]]
binding = "API_SERVICE"
service = "meigallery-api"

[vars]
NUXT_PUBLIC_APP_ENV = "production"
NUXT_PUBLIC_API_BASE_URL = "https://meigallery-api.250770503.workers.dev"
# Turnstile site key（公开值，在 Cloudflare Dashboard 创建 Turnstile widget 后填入）
# 留空则前端跳过人机验证
NUXT_PUBLIC_TURNSTILE_SITE_KEY = ""

# ─── 开发环境 ───
[env.dev]
name = "meigallery-web-dev"

[env.dev.assets]
directory = ".output/public"

# Service Binding（开发环境指向 dev API Worker）
[[env.dev.services]]
binding = "API_SERVICE"
service = "meigallery-api-dev"

[env.dev.vars]
NUXT_PUBLIC_APP_ENV = "development"
NUXT_PUBLIC_API_BASE_URL = "https://meigallery-api-dev.250770503.workers.dev"
NUXT_PUBLIC_TURNSTILE_SITE_KEY = ""
