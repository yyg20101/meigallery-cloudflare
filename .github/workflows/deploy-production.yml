# 生产环境部署
# 触发：推送到 main 分支（通常由 PR 合入触发）
name: 部署生产环境

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # 生产部署不取消进行中的任务

jobs:
  deploy:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: API 单元测试
        run: pnpm --filter @meigallery/api test

      - name: 构建前端
        run: pnpm --filter @meigallery/web build

      # D1 迁移
      - name: 执行 D1 数据库迁移
        run: pnpm --filter @meigallery/api exec wrangler d1 migrations apply meigallery-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 部署 API Worker
      - name: 部署 API Worker
        run: pnpm --filter @meigallery/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 部署 Web Worker
      - name: 部署 Web Worker
        run: pnpm --filter @meigallery/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
