# CI：测试 + 类型检查 + 构建验证
# 触发：PR 到 main 或 dev，以及 dev 分支推送
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 + 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 脚本测试
        run: pnpm test:scripts

      - name: API 类型检查
        run: pnpm --filter @meigallery/api exec tsc --noEmit

      - name: Web 类型检查
        run: pnpm --filter @meigallery/web typecheck

      - name: Web 组件测试
        run: pnpm --filter @meigallery/web test:unit

      - name: API 单元测试
        run: pnpm --filter @meigallery/api test

      - name: API 覆盖率
        run: pnpm --filter @meigallery/api test:coverage

      - name: 上传 API 覆盖率报告
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: api-coverage
          path: packages/api/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: 安装 Playwright 浏览器
        run: pnpm --filter @meigallery/web exec playwright install --with-deps chromium

      - name: Web Playwright smoke
        run: pnpm --filter @meigallery/web test:e2e

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm --filter @meigallery/web build

      - name: 构建 API（dry-run）
        run: pnpm --filter @meigallery/api build
