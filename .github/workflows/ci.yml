# CI：测试 + 类型检查 + 构建验证
# 触发：PR 到 main 或 dev，以及 dev 分支推送
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 + 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: API 类型检查
        run: pnpm --filter @meigallery/api exec tsc --noEmit

      - name: Web 类型检查
        run: pnpm --filter @meigallery/web typecheck

      - name: API 单元测试
        run: pnpm --filter @meigallery/api test

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm --filter @meigallery/web build

      - name: 构建 API（dry-run）
        run: pnpm --filter @meigallery/api build
