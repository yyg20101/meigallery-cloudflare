# MeiGallery Cloudflare wrangler 配置
# 生产环境配置，本地开发由 Nuxt/Nitro 自动模拟 bindings
name = "meigallery"
compatibility_date = "2024-11-01"
pages_build_output_dir = ".output/public"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "meigallery-db"
database_id = "" # 生产环境填入实际 database_id

# R2 存储桶绑定
[[r2_buckets]]
binding = "R2"
bucket_name = "meigallery-media"

# 环境变量（敏感值通过 Cloudflare Dashboard 或 wrangler secret 设置）
[vars]
APP_ENV = "production"
