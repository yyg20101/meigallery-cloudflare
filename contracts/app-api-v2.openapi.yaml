    Bootstrap:
      type: object
      additionalProperties: false
      required: [product, appVersion, capabilities, discovery, auth, messaging, safety]
      properties:
        product:
          type: string
          const: meigallery
        appVersion:
          type: string
          const: '1.0'
        capabilities:
          type: object
          additionalProperties: false
          required: [discovery, auth, interactions, membership, messaging, safety, payments, systemPush]
          properties:
            discovery:
              type: boolean
              const: true
            auth:
              type: boolean
            interactions:
              type: object
              additionalProperties: false
              required: [like, follow, favorite, history]
              properties:
                like:
                  type: boolean
                follow:
                  type: boolean
                favorite:
                  type: boolean
                  const: false
                history:
                  type: boolean
                  const: false
            membership:
              type: object
              additionalProperties: false
              required: [catalog, entitlements, applications]
              properties:
                catalog:
                  type: boolean
                entitlements:
                  type: boolean
                applications:
                  type: boolean
                  const: false
            messaging:
              type: boolean
            safety:
              type: object
              additionalProperties: false
              required: [reports, blocks, conversationClose]
              properties:
                reports:
                  type: boolean
                blocks:
                  type: boolean
                conversationClose:
                  type: boolean
            payments:
              type: boolean
              const: false
            systemPush:
              type: boolean
              const: false
        discovery:
          type: object
          additionalProperties: false
          required: [defaultSort, allowedSorts, defaultPageSize, maxPageSize]
          properties:
            defaultSort:
              $ref: '#/components/schemas/DiscoverySort'
            allowedSorts:
              type: array
              items:
                $ref: '#/components/schemas/DiscoverySort'
            defaultPageSize:
              type: integer
              const: 20
            maxPageSize:
              type: integer
              const: 40
        auth:
          type: object
          additionalProperties: false
          required:
            - methods
            - registrationEnabled
            - deviceManagementEnabled
            - accessTokenTtlSeconds
            - challenge
            - documents
          properties:
            methods:
              type: array
              maxItems: 1
              items:
                type: string
                const: email
            registrationEnabled:
              type: boolean
            deviceManagementEnabled:
              type: boolean
            accessTokenTtlSeconds:
              type: integer
              minimum: 60
            challenge:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [type]
                  properties:
                    type:
                      type: string
                      const: none
                - type: object
                  additionalProperties: false
                  required: [type, siteKey, pagePath, resultPath]
                  properties:
                    type:
                      type: string
                      const: turnstile
                    siteKey:
                      type: string
                    pagePath:
                      type: string
                      const: /api/v2/auth/turnstile
                    resultPath:
                      type: string
                      const: /api/v2/auth/turnstile/result
            documents:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                    - termsVersion
                    - privacyVersion
                    - platformOperationVersion
                    - eligibilityVersion
                    - termsUrl
                    - privacyUrl
                    - platformOperationUrl
                    - eligibilityUrl
                  properties:
                    termsVersion:
                      type: string
                    privacyVersion:
                      type: string
                    platformOperationVersion:
                      type: string
                    eligibilityVersion:
                      type: string
                    termsUrl:
                      type: string
                      format: uri
                    privacyUrl:
                      type: string
                      format: uri
                    platformOperationUrl:
                      type: string
                      format: uri
                    eligibilityUrl:
                      type: string
                      format: uri
        messaging:
          type: object
          additionalProperties: false
          required: [receiverLabel, disclosureVersion, disclosureText, transport, maxTextLength]
          properties:
            receiverLabel:
              type: string
              const: 平台运营接收
            disclosureVersion:
              type: string
              minLength: 1
              maxLength: 80
            disclosureText:
              type: string
              minLength: 1
              maxLength: 240
            transport:
              type: string
              const: http_pull
            maxTextLength:
              type: integer
              const: 1000
        safety:
          type: object
          additionalProperties: false
          required: [reasonCatalogVersion, maxDescriptionLength, reportTargets, reasons]
          properties:
            reasonCatalogVersion:
              type: string
              minLength: 1
              maxLength: 80
            maxDescriptionLength:
              type: integer
              const: 500
            reportTargets:
              type: array
              minItems: 4
              maxItems: 4
              uniqueItems: true
              items:
                $ref: '#/components/schemas/SafetyReportTargetType'
            reasons:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SafetyReason'
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Bootstrap'
        meta:
          $ref: '#/components/schemas/Meta'
    SafetyReason:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
