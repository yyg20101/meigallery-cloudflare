        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: 服务端生成的请求追踪 ID。
      schema:
        type: string
    ContractVersion:
      description: 当前响应契约版本。
      schema:
        type: string
        const: 1.11.0
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: '^pp_[A-Za-z0-9_-]{1,77}$'
    FavoriteFolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ff_[A-Za-z0-9_-]{1,93}$'
    ListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 40
        default: 20
    ListCursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: 与当前账号和关系类型隔离的不透明游标。
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^cv_[A-Za-z0-9_-]{1,77}$'
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ntf_[A-Za-z0-9_-]{1,92}$'
    MembershipApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ama_[A-Za-z0-9_-]{1,76}$'
    MembershipApplicationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      description: 会员申请单次逻辑写操作的稳定随机键；相同正文重试必须复用原值，不得跨操作复用。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[!-~]+$'
      description: 每次逻辑写操作的稳定随机键；重试必须复用原值，不能跨不同正文复用。
  responses:
    BadRequest:
      description: 查询参数或游标无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或当前不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 访问凭证缺失、无效、过期或已撤销
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 能力未启用、账号受限或身份方式不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 同意版本、当前状态或对象操作发生冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 请求结构正确，但名称或业务内容不满足约束
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 新话题日额度已用完或发送频率过高
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 账号、人机验证、邮件服务或会员目录尚未完成安全配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DiscoverySort:
      type: string
      enum: [recommended, popular, latest]
    Meta:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, apiVersion, contractVersion]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        apiVersion:
          type: string
          const: '2'
        contractVersion:
          type: string
          const: 1.11.0
    ListMeta:
