              maxItems: 5
              items:
                type: object
                additionalProperties: false
                required: [code, label, preference]
                properties:
                  code:
                    $ref: '#/components/schemas/NotificationCategory'
                  label:
                    type: string
                    minLength: 1
                    maxLength: 24
                  preference:
