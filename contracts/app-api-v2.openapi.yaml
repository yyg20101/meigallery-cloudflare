    Bootstrap:
      type: object
      additionalProperties: false
      required: [product, appVersion, capabilities, discovery, interactionCollections, auth, membershipApplications, messaging, notifications, wallet, safety]
      properties:
        product:
          type: string
          const: meigallery
        appVersion:
          type: string
          const: '1.0'
        capabilities:
          type: object
          additionalProperties: false
          required: [discovery, auth, interactions, membership, messaging, notifications, wallet, safety, payments, systemPush]
          properties:
            discovery:
              type: boolean
              const: true
            auth:
              type: boolean
            interactions:
              type: object
              additionalProperties: false
              required: [like, follow, favorite, history]
              properties:
                like:
                  type: boolean
                follow:
                  type: boolean
                favorite:
                  type: boolean
                history:
                  type: boolean
            membership:
              type: object
              additionalProperties: false
              required: [catalog, entitlements, applications]
              properties:
                catalog:
                  type: boolean
                entitlements:
                  type: boolean
                applications:
                  type: boolean
            messaging:
              type: boolean
            notifications:
              type: boolean
            wallet:
              type: boolean
            safety:
              type: object
              additionalProperties: false
              required: [reports, blocks, conversationClose, appeals]
              properties:
                reports:
                  type: boolean
                blocks:
                  type: boolean
                conversationClose:
                  type: boolean
                appeals:
                  type: boolean
            payments:
              type: boolean
              const: false
            systemPush:
              type: boolean
              const: false
        discovery:
          type: object
          additionalProperties: false
          required: [defaultSort, allowedSorts, defaultPageSize, maxPageSize]
          properties:
            defaultSort:
              $ref: '#/components/schemas/DiscoverySort'
            allowedSorts:
              type: array
              items:
                $ref: '#/components/schemas/DiscoverySort'
            defaultPageSize:
              type: integer
              const: 20
            maxPageSize:
              type: integer
              const: 40
        interactionCollections:
          type: object
          additionalProperties: false
          required: [policyVersion, defaultFolderLabel, maxFolderNameLength, maxItemsPerFolder, historyRecordingDefault]
          properties:
            policyVersion:
              type: string
              pattern: '^icp_[A-Za-z0-9_-]{1,92}$'
            defaultFolderLabel:
              type: string
              const: 默认收藏
            maxFolderNameLength:
              type: integer
              const: 30
            maxItemsPerFolder:
              type: integer
              const: 500
            historyRecordingDefault:
              type: boolean
              const: false
        auth:
          type: object
          additionalProperties: false
          required:
            - methods
            - registrationEnabled
            - deviceManagementEnabled
            - accessTokenTtlSeconds
            - challenge
            - documents
          properties:
            methods:
              type: array
              maxItems: 1
              items:
                type: string
                const: email
            registrationEnabled:
              type: boolean
            deviceManagementEnabled:
              type: boolean
            accessTokenTtlSeconds:
              type: integer
              minimum: 60
            challenge:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [type]
                  properties:
                    type:
                      type: string
                      const: none
                - type: object
                  additionalProperties: false
                  required: [type, siteKey, pagePath, resultPath]
                  properties:
                    type:
                      type: string
                      const: turnstile
                    siteKey:
                      type: string
                    pagePath:
                      type: string
                      const: /api/v2/auth/turnstile
                    resultPath:
                      type: string
                      const: /api/v2/auth/turnstile/result
            documents:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                    - termsVersion
                    - privacyVersion
                    - platformOperationVersion
                    - eligibilityVersion
                    - termsUrl
                    - privacyUrl
                    - platformOperationUrl
                    - eligibilityUrl
                  properties:
                    termsVersion:
                      type: string
                    privacyVersion:
                      type: string
                    platformOperationVersion:
                      type: string
                    eligibilityVersion:
                      type: string
                    termsUrl:
                      type: string
                      format: uri
                    privacyUrl:
                      type: string
                      format: uri
                    platformOperationUrl:
                      type: string
                      format: uri
                    eligibilityUrl:
                      type: string
                      format: uri
        membershipApplications:
          type: object
          additionalProperties: false
          required: [disclosureVersion, disclosureText, contactMethod, maxStatementLength, contactWindows]
          properties:
            disclosureVersion:
              type: string
              minLength: 3
              maxLength: 80
            disclosureText:
              type: string
              minLength: 1
              maxLength: 500
              description: 明确申请不代表获得会员、不承诺固定时效或必然通过。
            contactMethod:
              type: string
              const: verified_email
            maxStatementLength:
              type: integer
              const: 300
            contactWindows:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: object
                additionalProperties: false
                required: [code, label]
                properties:
                  code:
                    $ref: '#/components/schemas/MembershipContactWindow'
                  label:
                    type: string
                    minLength: 1
                    maxLength: 24
