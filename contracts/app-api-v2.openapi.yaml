        - operationMode
        - receiverLabel
        - disclosureVersion
        - disclosureText
        - status
        - queueStatus
        - lastSequence
        - unreadCount
        - canSend
        - sendUnavailableReason
        - canClose
        - closeUnavailableReason
        - lastMessageAt
        - createdAt
        - updatedAt
      properties:
        conversationId:
          type: string
          pattern: '^cv_[A-Za-z0-9_-]{1,77}$'
        profile:
          $ref: '#/components/schemas/ConversationProfileSummary'
        operationMode:
          type: string
          const: platform_managed
        receiverLabel:
          type: string
          const: 平台运营接收
        disclosureVersion:
          type: string
        disclosureText:
          type: string
        status:
          type: string
          enum: [active, restricted, closed]
        queueStatus:
          type: string
          enum: [awaiting_viewer, awaiting_operator, closed]
        lastSequence:
          type: integer
          minimum: 1
        unreadCount:
          type: integer
          minimum: 0
        canSend:
          type: boolean
        sendUnavailableReason:
          type: [string, 'null']
        canClose:
          type: boolean
        closeUnavailableReason:
          type: [string, 'null']
        lastMessageAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationMessage:
      type: object
      additionalProperties: false
      required:
        - messageId
        - conversationId
        - sequence
        - senderType
        - senderLabel
        - clientMessageId
        - contentType
        - text
        - status
        - readByReceiver
        - createdAt
      properties:
        messageId:
          type: string
          pattern: '^msg_[A-Za-z0-9_-]{1,76}$'
        conversationId:
          type: string
          pattern: '^cv_[A-Za-z0-9_-]{1,77}$'
        sequence:
          type: integer
          minimum: 1
        senderType:
          type: string
          enum: [viewer, platform_operator, system]
        senderLabel:
          type: string
        clientMessageId:
          type: string
        contentType:
          type: string
          enum: [text, system]
        text:
          type: string
        status:
          type: string
          enum: [accepted, review_pending, rejected, recalled]
        readByReceiver:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ConversationCreateResult:
