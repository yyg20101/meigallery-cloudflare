    get:
      tags: [Discovery]
      operationId: listDiscoveryFeed
      summary: 获取公开人物发现列表
      description: >-
        只返回认证状态为 verified、发布状态为 published、授权状态为 active、可见状态为
        visible、授权已开始且未过期、认证未过期且来源图库仍为 published 的公开投影。
        现有图库不会自动进入此列表。匿名请求返回公共列表；携带有效 Bearer token 时，
        服务端会排除当前观看者已屏蔽的人物。携带无效 token 会返回 401，不降级为匿名结果。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/DiscoverySort'
          description: 默认 recommended。
        - name: region
          in: query
          schema:
            type: string
            pattern: '^[a-z0-9-]{2,32}$'
          description: 由地区目录返回的稳定 code。
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 40
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          description: 与当前排序、地区和规则版本绑定的不透明游标。
      responses:
        '200':
