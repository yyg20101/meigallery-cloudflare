openapi: 3.1.0
info:
  title: MeiGallery App API v2
  version: 1.6.0
  description: >-
    App 1.0 的公共发现契约、Auth-1 保守账号访问、Interaction-1 喜欢/关注、Membership-1
    五级会员开发基线、Message-1 平台话题 HTTP 权威闭环与 Message-2 举报、屏蔽、话题关闭安全闭环。账号能力必须同时具备
    APP_AUTH_ENABLED、版本化文档、可阅读正文 URL 和生产人机验证配置才会由 bootstrap 启用；默认关闭，
    会员、消息和安全能力使用独立开关且生产环境还要求发布门禁。只有 available 且 executable 的消息权益可执行。
    话题始终由平台运营接收，不代表真人本人入驻或回复；实时通道、媒体消息、申诉、会员申请、支付、金币和媒体访问仍未纳入本次契约。
servers:
  - url: https://{host}
    variables:
      host:
        default: api.616618.xyz
  - url: http://127.0.0.1:8787
tags:
  - name: Bootstrap
  - name: Auth
  - name: Account
  - name: Discovery
  - name: PersonProfile
  - name: Interaction
  - name: Membership
  - name: Messaging
  - name: Safety
paths:
  /api/v2/app/bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getAppBootstrap
      summary: 获取 App 能力与发现页配置
      responses:
        '200':
          description: 当前客户端可用能力
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/auth/email-challenges:
    post:
      tags: [Auth]
      operationId: createAppEmailChallenge
      summary: 请求注册邮箱验证码
      description: 始终返回统一接收结果，不披露邮箱是否已经存在。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChallengeRequest'
      responses:
        '200':
          description: 请求已统一接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/turnstile:
    get:
      tags: [Auth]
      operationId: getAppTurnstileChallenge
      summary: 获取 App 原生 WebView 使用的受控 Turnstile 挑战页
      description: >-
        只接受白名单 purpose；页面不包含 Secret Key，不使用原生 JavaScript bridge。
        成功 token 由同源结果 URL 的 fragment 交给原生端拦截，服务端仍必须执行 Siteverify。
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [email_challenge, register, login]
      responses:
        '200':
          description: 禁止缓存的 HTML 挑战页
          content:
            text/html:
              schema:
                type: string
        '400':
          description: purpose 非法
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/turnstile/result:
    get:
      tags: [Auth]
      operationId: getAppTurnstileResultFallback
      summary: Turnstile 原生回调兜底页
      description: 原生端应在导航发生前拦截该路径；服务器不会接收或回显 URL fragment 中的 token。
      responses:
        '200':
          description: 禁止缓存的无敏感信息 HTML 兜底页
          content:
            text/html:
              schema:
                type: string
  /api/v2/auth/register:
    post:
      tags: [Auth]
      operationId: registerAppAccount
      summary: 创建观看者账号和当前设备会话
      description: >-
        只创建 Account、邮箱身份、版本化同意、设备和会话；不得创建 Person、
        PersonProfile 或公开投影。验证码必须有效，文档版本必须与 bootstrap 一致。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 观看者账号创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/login:
    post:
      tags: [Auth]
      operationId: loginAppAccount
      summary: 使用邮箱和密码登录观看者账号
      description: >-
        对已有 Web 账号只有在密码验证通过后才建立 App 邮箱身份映射。账号缺少当前
        文档版本时必须在请求中重新提交同意，否则返回 CONSENT_REQUIRED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAppSession
      summary: 旋转访问与续期凭证
      description: >-
        成功后旧访问凭证立即失效。已被替换的续期凭证再次出现时，服务端撤销该会话族。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 凭证旋转成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutAppSession
      summary: 退出当前设备会话
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 当前会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me:
    get:
      tags: [Account]
      operationId: getAppMe
      summary: 获取当前观看者账号和会员摘要
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 本人账号摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/membership/catalog:
    get:
      tags: [Membership]
      operationId: getAppMembershipCatalog
      summary: 获取版本化五级会员目录
      description: >-
        可在未登录状态读取；acquisition 只说明联系平台的人工路径，不提供购买或申请接口。
        availability=planned 的权益只能展示“规划中”，客户端不得执行。
      responses:
        '200':
          description: 当前环境启用的会员目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipCatalogResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me/entitlements:
    get:
      tags: [Membership]
      operationId: getAppMembershipEntitlements
      summary: 获取本人当前会员与 typed entitlement 快照
      description: >-
        只解析 App 会员 grant；不会自动映射旧 Web vip/svip。权限执行必须同时检查 executable=true，
        不能根据显示名称或客户端缓存自行放行。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 当前账号的服务端权威权益快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/conversations:
    get:
      tags: [Messaging]
      operationId: listAppConversations
      summary: 获取本人的平台话题列表
      description: 只返回当前账号自己的会话；人物资料失效时返回最小占位并转为只读。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: 平台话题列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Messaging]
      operationId: createAppConversation
      summary: 发起由平台运营接收的新话题
      description: >-
        只允许有效会员针对当前可见的 platform_managed 人物发起；按服务端上海自然日额度原子扣减。
        disclosureVersion 必须与 bootstrap 对应的当前服务说明一致，同一账号与人物只保留一个话题。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '200':
          description: 已存在的话题或幂等重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
        '201':
          description: 新话题已创建并写入平台接收说明
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/conversations/{conversationId}:
    get:
      tags: [Messaging]
      operationId: getAppConversation
      summary: 获取本人单个平台话题摘要
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 平台话题摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/conversations/{conversationId}/messages:
    get:
      tags: [Messaging]
      operationId: listAppConversationMessages
      summary: 按序号增量拉取本人话题消息
      description: Message-1 使用 HTTP 拉取，不承诺实时到达；消息按 sequence 严格升序。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: afterSequence
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 增量消息页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messaging]
      operationId: sendAppConversationMessage
      summary: 在本人有效话题中发送文本消息
      description: 只接受 text；表情作为普通 Unicode 文本，不支持图片、语音、视频、礼物或付款。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageSendRequest'
      responses:
        '200':
          description: 幂等重放的原消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageSendResponse'
        '201':
          description: 文本消息已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/conversations/{conversationId}/read:
    post:
      tags: [Messaging]
      operationId: markAppConversationRead
      summary: 更新本人话题已读序号
      description: 只允许单调前进，不能超过服务端当前 lastSequence。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationReadRequest'
      responses:
        '200':
          description: 服务端确认的已读序号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/conversations/{conversationId}/close:
    post:
      tags: [Safety, Messaging]
      operationId: closeAppConversation
      summary: 由观看者永久关闭本人的平台话题
      description: >-
        关闭后双方只能查看历史且不能重新打开；服务端追加系统消息并释放运营分配。
        重试必须复用同一个 Idempotency-Key。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已关闭话题或幂等重放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCloseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me/devices:
    get:
      tags: [Account]
      operationId: listAppDevices
      summary: 获取本人设备列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 最多返回最近 50 台本人设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/me/devices/{deviceId}:
    delete:
      tags: [Account]
      operationId: revokeAppDevice
      summary: 远程退出本人其他设备
      description: 幂等撤销目标设备的全部活跃 App 会话；当前设备必须使用 logout。
      security:
        - BearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            pattern: '^dev_[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: 设备已退出或此前已经退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/me/likes:
    get:
      tags: [Interaction]
      operationId: listAppViewerLikes
      summary: 获取本人的喜欢列表
      description: 资料已失效时只返回最小不可用占位，不返回历史公开内容。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: 本人的喜欢关系
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/me/follows:
    get:
      tags: [Interaction]
      operationId: listAppViewerFollows
      summary: 获取本人的已关注列表
      description: Interaction-1 只提供关系列表；公开内容更新流与通知尚未启用。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: 本人的关注关系
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/me/blocks:
    get:
      tags: [Safety]
      operationId: listAppProfileBlocks
      summary: 获取本人的当前屏蔽人物列表
      description: 只返回当前仍为 active 的屏蔽关系；人物不可公开时返回最小不可用占位。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: 当前屏蔽人物列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBlockListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/reports:
    post:
      tags: [Safety]
      operationId: createAppSafetyReport
      summary: 提交人物、媒体、话题或消息举报
      description: >-
        服务端校验目标归属和当前证据，消息举报只固化目标消息摘要以及前后各一条引用。
        不接受用户上传媒体证据；每个账号按服务端自然日最多提交 20 次。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyReportCreateRequest'
      responses:
        '200':
          description: 幂等重放原举报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReportCreateResponse'
        '201':
          description: 举报已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReportCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me/reports:
    get:
      tags: [Safety]
      operationId: listMyAppSafetyReports
      summary: 获取本人的举报记录
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: 本人的举报摘要列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReportListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/me/reports/{reportId}:
    get:
      tags: [Safety]
      operationId: getMyAppSafetyReport
      summary: 获取本人的举报详情和用户可见时间线
      security:
        - BearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            pattern: '^rpt_[A-Za-z0-9_-]{1,76}$'
      responses:
        '200':
          description: 本人举报详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReportDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/discovery/feed:
    get:
      tags: [Discovery]
      operationId: listDiscoveryFeed
      summary: 获取公开人物发现列表
      description: >-
        只返回认证状态为 verified、发布状态为 published、授权状态为 active、可见状态为
        visible、授权已开始且未过期、认证未过期且来源图库仍为 published 的公开投影。
        现有图库不会自动进入此列表。匿名请求返回公共列表；携带有效 Bearer token 时，
        服务端会排除当前观看者已屏蔽的人物。携带无效 token 会返回 401，不降级为匿名结果。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/DiscoverySort'
          description: 默认 recommended。
        - name: region
          in: query
          schema:
            type: string
            pattern: '^[a-z0-9-]{2,32}$'
          description: 由地区目录返回的稳定 code。
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 40
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          description: 与当前排序、地区和规则版本绑定的不透明游标。
      responses:
        '200':
          description: 公开人物列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/discovery/regions:
    get:
      tags: [Discovery]
      operationId: listDiscoveryRegions
      summary: 获取当前存在公开人物的地区目录
      responses:
        '200':
          description: 地区目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/person-profiles/{profileId}:
    get:
      tags: [PersonProfile]
      operationId: getPublicPersonProfile
      summary: 获取公开人物详情基础投影
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            pattern: '^pp_[A-Za-z0-9_-]{1,77}$'
      responses:
        '200':
          description: 公开人物详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/person-profiles/{profileId}/safety:
    get:
      tags: [Safety]
      operationId: getAppProfileSafetyState
      summary: 获取本人对人物资料的屏蔽状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: 服务端权威屏蔽状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBlockStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/person-profiles/{profileId}/block:
    put:
      tags: [Safety]
      operationId: blockAppPersonProfile
      summary: 屏蔽人物资料并清理本人既有关系
      description: >-
        原子删除当前账号对人物的喜欢和关注，关闭关联话题并使登录态发现列表排除该人物。
        解除屏蔽不会恢复旧关系或旧话题。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 屏蔽后的权威状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBlockMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Safety]
      operationId: unblockAppPersonProfile
      summary: 解除人物资料屏蔽
      description: 只恢复后续访问资格，不恢复此前清理的喜欢、关注或已关闭话题。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 解除屏蔽后的权威状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBlockMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/person-profiles/{profileId}/interactions:
    get:
      tags: [Interaction]
      operationId: getAppViewerInteractionState
      summary: 获取本人对当前人物资料的喜欢与关注状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: 服务端权威关系状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/person-profiles/{profileId}/like:
    put:
      tags: [Interaction]
      operationId: likeAppPersonProfile
      summary: 幂等喜欢当前可用人物资料
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: 喜欢后的权威状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Interaction]
      operationId: unlikeAppPersonProfile
      summary: 幂等取消喜欢
      description: 即使资料已失效也允许本人清理既有关系。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: 取消后的权威状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/person-profiles/{profileId}/follow:
    put:
      tags: [Interaction]
      operationId: followAppPersonProfile
      summary: 幂等关注当前可用人物资料
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: 关注后的权威状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Interaction]
      operationId: unfollowAppPersonProfile
      summary: 幂等取消关注
      description: 即使资料已失效也允许本人清理既有关系。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: 取消后的权威状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerInteractionStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: 服务端生成的请求追踪 ID。
      schema:
        type: string
    ContractVersion:
      description: 当前响应契约版本。
      schema:
        type: string
        const: 1.6.0
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: '^pp_[A-Za-z0-9_-]{1,77}$'
    ListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 40
        default: 20
    ListCursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: 与当前账号和关系类型隔离的不透明游标。
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^cv_[A-Za-z0-9_-]{1,77}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[!-~]+$'
      description: 每次逻辑写操作的稳定随机键；重试必须复用原值，不能跨不同正文复用。
  responses:
    BadRequest:
      description: 查询参数或游标无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或当前不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 访问凭证缺失、无效、过期或已撤销
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 能力未启用、账号受限或身份方式不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 同意版本、当前状态或对象操作发生冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 新话题日额度已用完或发送频率过高
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 账号、人机验证、邮件服务或会员目录尚未完成安全配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DiscoverySort:
      type: string
      enum: [recommended, popular, latest]
    Meta:
      type: object
      additionalProperties: false
      required: [requestId, serverTime, apiVersion, contractVersion]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        apiVersion:
          type: string
          const: '2'
        contractVersion:
          type: string
          const: 1.6.0
    ListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [nextCursor, hasMore]
          properties:
            nextCursor:
              type: [string, 'null']
            hasMore:
              type: boolean
      unevaluatedProperties: false
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    DeviceDescriptor:
      type: object
      additionalProperties: false
      required: [installationId, platform, displayName, appVersion]
      properties:
        installationId:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: 客户端随机生成的安装标识；不得使用广告 ID、硬件序列号或精确位置。
        platform:
          type: string
          enum: [android, ios]
        displayName:
          type: string
          minLength: 2
          maxLength: 80
        appVersion:
          type: string
          minLength: 1
          maxLength: 40
    ConsentInput:
      type: object
      additionalProperties: false
      required:
        - termsVersion
        - privacyVersion
        - platformOperationVersion
        - eligibilityVersion
        - eligibilityConfirmed
      properties:
        termsVersion:
          type: string
        privacyVersion:
          type: string
        platformOperationVersion:
          type: string
        eligibilityVersion:
          type: string
        eligibilityConfirmed:
          type: boolean
          const: true
          description: 只记录对当前必要资格说明的确认，不在本契约写死年龄数值。
    EmailChallengeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        challengeToken:
          type: string
          maxLength: 2048
    EmailChallengeResult:
      type: object
      additionalProperties: false
      required: [accepted, cooldownSeconds]
      properties:
        accepted:
          type: boolean
          const: true
        cooldownSeconds:
          type: integer
          minimum: 1
    EmailChallengeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/EmailChallengeResult'
        meta:
          $ref: '#/components/schemas/Meta'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, verificationCode, consents, device]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        nickname:
          type: [string, 'null']
          maxLength: 40
        verificationCode:
          type: string
          pattern: '^\d{6}$'
        consents:
          $ref: '#/components/schemas/ConsentInput'
        device:
          $ref: '#/components/schemas/DeviceDescriptor'
        challengeToken:
          type: string
          maxLength: 2048
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        consents:
          $ref: '#/components/schemas/ConsentInput'
        device:
          $ref: '#/components/schemas/DeviceDescriptor'
        challengeToken:
          type: string
          maxLength: 2048
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 40
          maxLength: 100
          writeOnly: true
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, email, nickname, role, status]
      properties:
        accountId:
          type: string
          pattern: '^acc_[A-Za-z0-9_-]+$'
        email:
          type: string
          format: email
        nickname:
          type: [string, 'null']
        role:
          type: string
        status:
          type: string
          const: active
    DeviceSummary:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - platform
        - displayName
        - appVersion
        - status
        - signedIn
        - current
        - firstSeenAt
        - lastSeenAt
        - revokedAt
      properties:
        deviceId:
          type: string
          pattern: '^dev_[A-Za-z0-9_-]+$'
        platform:
          type: string
          enum: [android, ios]
        displayName:
          type: string
        appVersion:
          type: string
        status:
          type: string
          enum: [active, revoked]
        signedIn:
          type: boolean
        current:
          type: boolean
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    AuthTokenPair:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, refreshToken, accessExpiresAt, refreshExpiresAt]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          writeOnly: true
        refreshToken:
          type: string
          writeOnly: true
        accessExpiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required: [account, device, tokens]
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        tokens:
          $ref: '#/components/schemas/AuthTokenPair'
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'
        meta:
          $ref: '#/components/schemas/Meta'
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [loggedOut]
          properties:
            loggedOut:
              type: boolean
              const: true
        meta:
          $ref: '#/components/schemas/Meta'
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [code, name, rank, expiresAt]
      properties:
        code:
          type: string
        name:
          type: string
        rank:
          type: integer
          minimum: 0
        expiresAt:
          type: [string, 'null']
          format: date-time
    MeSummary:
      type: object
      additionalProperties: false
      required: [account, membership, currentDeviceId]
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        membership:
          $ref: '#/components/schemas/MembershipSummary'
        currentDeviceId:
          type: string
    MeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/MeSummary'
        meta:
          $ref: '#/components/schemas/Meta'
    MembershipEntitlementValue:
      oneOf:
        - type: boolean
        - type: integer
          minimum: 0
        - type: string
          minLength: 1
          maxLength: 64
    MembershipEntitlementDefinition:
      type: object
      additionalProperties: false
      required:
        - key
        - schemaVersion
        - valueType
        - defaultValue
        - mergeStrategy
        - periodRule
        - clientCapability
        - displayName
        - description
        - unitLabel
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9._]+$'
        schemaVersion:
          type: integer
          minimum: 1
        valueType:
          type: string
          enum: [boolean, integer, enum]
        defaultValue:
          $ref: '#/components/schemas/MembershipEntitlementValue'
        mergeStrategy:
          type: string
          const: highest_rank
        periodRule:
          type: [string, 'null']
        clientCapability:
          type: string
        displayName:
          type: string
        description:
          type: string
        unitLabel:
          type: [string, 'null']
    MembershipTierEntitlement:
      type: object
      additionalProperties: false
      required: [key, value, availability]
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/MembershipEntitlementValue'
        availability:
          type: string
          enum: [available, planned]
    MembershipTier:
      type: object
      additionalProperties: false
      required:
        - tierId
        - code
        - displayName
        - tagline
        - rank
        - accentToken
        - acquisitionLabel
        - serviceDisclosure
        - entitlements
      properties:
        tierId:
          type: string
          pattern: '^amt_[A-Za-z0-9_-]+$'
        code:
          type: string
        displayName:
          type: string
        tagline:
          type: string
        rank:
          type: integer
          minimum: 1
        accentToken:
          type: string
        acquisitionLabel:
          type: string
        serviceDisclosure:
          type: string
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/MembershipTierEntitlement'
    MembershipCatalog:
      type: object
      additionalProperties: false
      required:
        - catalogVersionId
        - versionCode
        - state
        - productionReady
        - effectiveAt
        - timezone
        - minimumClientVersion
        - acquisition
        - definitions
        - tiers
      properties:
        catalogVersionId:
          type: string
          pattern: '^amc_[A-Za-z0-9_-]+$'
        versionCode:
          type: string
        state:
          type: string
          enum: [development, published]
        productionReady:
          type: boolean
        effectiveAt:
          type: string
          format: date-time
        timezone:
          type: string
        minimumClientVersion:
          type: string
        acquisition:
          type: object
          additionalProperties: false
          required: [mode, applicationEnabled, paymentEnabled, label]
          properties:
            mode:
              type: string
              const: contact_platform
            applicationEnabled:
              type: boolean
              const: false
            paymentEnabled:
              type: boolean
              const: false
            label:
              type: string
        definitions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MembershipEntitlementDefinition'
        tiers:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/MembershipTier'
    MembershipCatalogResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/MembershipCatalog'
        meta:
          $ref: '#/components/schemas/Meta'
    MembershipTierSummary:
      type: object
