      additionalProperties: false
      required: [type, profileId, mediaId, conversationId, messageId]
      properties:
        type:
          $ref: '#/components/schemas/SafetyReportTargetType'
        profileId:
          type: string
          pattern: '^pp_[A-Za-z0-9_-]{1,77}$'
        mediaId:
          type: [string, 'null']
        conversationId:
          type: [string, 'null']
        messageId:
          type: [string, 'null']
    SafetyReportCreateRequest:
      type: object
      additionalProperties: false
      required: [targetType, profileId, reasonCode]
      properties:
        targetType:
          $ref: '#/components/schemas/SafetyReportTargetType'
        profileId:
          type: string
          pattern: '^pp_[A-Za-z0-9_-]{1,77}$'
        mediaId:
          type: [string, 'null']
        conversationId:
          type: [string, 'null']
          pattern: '^cv_[A-Za-z0-9_-]{1,77}$'
        messageId:
          type: [string, 'null']
          pattern: '^msg_[A-Za-z0-9_-]{1,76}$'
