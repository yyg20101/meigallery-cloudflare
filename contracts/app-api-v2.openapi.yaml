openapi: 3.1.0
info:
  title: MeiGallery App API v2
  version: 1.11.0
  description: >-
    App 1.0 的公共发现契约、Auth-1 保守账号访问、Interaction-1 喜欢/关注、Membership-1
    五级会员开发基线、Membership-2 站内申请、Message-1 平台话题 HTTP 权威闭环、Message-2 举报/屏蔽/话题关闭安全闭环与 Safety-2 独立复核申诉。账号能力必须同时具备
    APP_AUTH_ENABLED、版本化文档、可阅读正文 URL 和生产人机验证配置才会由 bootstrap 启用；默认关闭，
    会员、消息和安全能力使用独立开关且生产环境还要求发布门禁。只有 available 且 executable 的消息权益可执行。
    话题始终由平台运营接收，不代表真人本人入驻或回复；Safety-2 仅支持本人举报“未发现违规”结论的一次文字复核申请。
    会员申请本身不产生 grant 或 entitlement，只有管理员正式发放成功后才显示已发放。
    Message-3 新增 HTTP pull 站内通知、服务端未读数、已读审计和可选分类偏好；通知只保存审核过的固定文案，
    受控动作打开时必须重新校验权威业务状态。Wallet-1 新增本人金币余额、追加式明细与分录详情；金币只记录管理员独立复核后的单笔调整，
    不开放购买、消费、转赠、兑换、提现或支付。Interaction-2 以默认关闭方式新增多文件夹收藏和本人浏览历史；
    收藏不等于喜欢或匹配，历史默认不记录且必须携带当前偏好版本写入。搜索历史、关注更新流、推荐信号、
    系统推送、实时通道、媒体消息、账号/金币申诉和媒体访问仍未纳入本次契约。
servers:
  - url: https://{host}
    variables:
      host:
        default: api.616618.xyz
  - url: http://127.0.0.1:8787
tags:
  - name: Bootstrap
  - name: Auth
  - name: Account
  - name: Discovery
  - name: PersonProfile
  - name: Interaction
  - name: Membership
  - name: Messaging
  - name: Notification
  - name: Wallet
  - name: Safety
paths:
  /api/v2/app/bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getAppBootstrap
      summary: 获取 App 能力与发现页配置
      responses:
        '200':
          description: 当前客户端可用能力
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/auth/email-challenges:
    post:
      tags: [Auth]
      operationId: createAppEmailChallenge
      summary: 请求注册邮箱验证码
      description: 始终返回统一接收结果，不披露邮箱是否已经存在。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChallengeRequest'
      responses:
        '200':
          description: 请求已统一接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/turnstile:
    get:
      tags: [Auth]
      operationId: getAppTurnstileChallenge
      summary: 获取 App 原生 WebView 使用的受控 Turnstile 挑战页
      description: >-
        只接受白名单 purpose；页面不包含 Secret Key，不使用原生 JavaScript bridge。
        成功 token 由同源结果 URL 的 fragment 交给原生端拦截，服务端仍必须执行 Siteverify。
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [email_challenge, register, login]
      responses:
        '200':
          description: 禁止缓存的 HTML 挑战页
          content:
            text/html:
              schema:
                type: string
        '400':
          description: purpose 非法
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/turnstile/result:
    get:
      tags: [Auth]
      operationId: getAppTurnstileResultFallback
      summary: Turnstile 原生回调兜底页
      description: 原生端应在导航发生前拦截该路径；服务器不会接收或回显 URL fragment 中的 token。
      responses:
        '200':
          description: 禁止缓存的无敏感信息 HTML 兜底页
          content:
            text/html:
              schema:
                type: string
  /api/v2/auth/register:
    post:
      tags: [Auth]
      operationId: registerAppAccount
      summary: 创建观看者账号和当前设备会话
      description: >-
        只创建 Account、邮箱身份、版本化同意、设备和会话；不得创建 Person、
        PersonProfile 或公开投影。验证码必须有效，文档版本必须与 bootstrap 一致。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 观看者账号创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/login:
    post:
      tags: [Auth]
      operationId: loginAppAccount
      summary: 使用邮箱和密码登录观看者账号
      description: >-
        对已有 Web 账号只有在密码验证通过后才建立 App 邮箱身份映射。账号缺少当前
        文档版本时必须在请求中重新提交同意，否则返回 CONSENT_REQUIRED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAppSession
      summary: 旋转访问与续期凭证
      description: >-
        成功后旧访问凭证立即失效。已被替换的续期凭证再次出现时，服务端撤销该会话族。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 凭证旋转成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutAppSession
      summary: 退出当前设备会话
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 当前会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me:
    get:
      tags: [Account]
      operationId: getAppMe
      summary: 获取当前观看者账号和会员摘要
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 本人账号摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/membership/catalog:
    get:
      tags: [Membership]
      operationId: getAppMembershipCatalog
      summary: 获取版本化五级会员目录
      description: >-
        可在未登录状态读取；acquisition 说明联系平台的人工路径，并按 bootstrap 一致性标记站内申请是否开放，不提供购买接口。
        availability=planned 的权益只能展示“规划中”，客户端不得执行。
      responses:
        '200':
          description: 当前环境启用的会员目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipCatalogResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me/entitlements:
    get:
      tags: [Membership]
      operationId: getAppMembershipEntitlements
      summary: 获取本人当前会员与 typed entitlement 快照
      description: >-
        只解析 App 会员 grant；不会自动映射旧 Web vip/svip。权限执行必须同时检查 executable=true，
        不能根据显示名称或客户端缓存自行放行。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 当前账号的服务端权威权益快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/me/membership-applications:
    get:
      tags: [Membership]
      operationId: listMyAppMembershipApplications
      summary: 获取本人最近会员申请与用户可见时间线
      description: 最多返回最近 20 条；不会返回管理员内部备注、审批锁或其他账号数据。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 本人会员申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/membership-applications:
    post:
      tags: [Membership]
      operationId: submitAppMembershipApplication
      summary: 提交站内会员申请
      description: >-
        联系方式固定复用已验证登录邮箱；同一账号只能有一条进行中申请。
        重复请求返回原申请，且申请本身绝不创建 grant、修改 rank 或下发 entitlement。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipApplicationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipApplicationSubmitRequest'
      responses:
        '200':
          description: 返回已有进行中申请或幂等重放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipApplicationMutationResponse'
        '201':
          description: 新申请已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipApplicationMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/membership-applications/{applicationId}:
    get:
      tags: [Membership]
      operationId: getMyAppMembershipApplication
      summary: 获取本人的单条会员申请
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipApplicationId'
      responses:
        '200':
          description: 本人会员申请详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/membership-applications/{applicationId}/resubmit:
    post:
      tags: [Membership]
      operationId: resubmitAppMembershipApplication
      summary: 补充信息并重新提交会员申请
      description: 只允许 needs_information 状态；意向等级保持不变并重新确认当前服务说明版本。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipApplicationId'
        - $ref: '#/components/parameters/MembershipApplicationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipApplicationResubmitRequest'
      responses:
        '200':
          description: 补充结果或幂等重放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipApplicationMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/membership-applications/{applicationId}/cancel:
    post:
      tags: [Membership]
      operationId: cancelAppMembershipApplication
      summary: 取消尚未进入正式发放的会员申请
      description: 只允许 submitted 或 needs_information；处理中和发放锁定后不能由用户取消。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipApplicationId'
        - $ref: '#/components/parameters/MembershipApplicationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipApplicationCancelRequest'
      responses:
        '200':
          description: 取消结果或幂等重放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipApplicationMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v2/conversations:
    get:
      tags: [Messaging]
      operationId: listAppConversations
      summary: 获取本人的平台话题列表
      description: 只返回当前账号自己的会话；人物资料失效时返回最小占位并转为只读。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: 平台话题列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Messaging]
      operationId: createAppConversation
      summary: 发起由平台运营接收的新话题
      description: >-
        只允许有效会员针对当前可见的 platform_managed 人物发起；按服务端上海自然日额度原子扣减。
        disclosureVersion 必须与 bootstrap 对应的当前服务说明一致，同一账号与人物只保留一个话题。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '200':
          description: 已存在的话题或幂等重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
        '201':
          description: 新话题已创建并写入平台接收说明
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/conversations/{conversationId}:
    get:
      tags: [Messaging]
      operationId: getAppConversation
      summary: 获取本人单个平台话题摘要
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 平台话题摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/conversations/{conversationId}/messages:
    get:
      tags: [Messaging]
      operationId: listAppConversationMessages
      summary: 按序号增量拉取本人话题消息
      description: Message-1 使用 HTTP 拉取，不承诺实时到达；消息按 sequence 严格升序。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: afterSequence
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 增量消息页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messaging]
      operationId: sendAppConversationMessage
      summary: 在本人有效话题中发送文本消息
      description: 只接受 text；表情作为普通 Unicode 文本，不支持图片、语音、视频、礼物或付款。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageSendRequest'
      responses:
        '200':
          description: 幂等重放的原消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageSendResponse'
        '201':
          description: 文本消息已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/conversations/{conversationId}/read:
    post:
      tags: [Messaging]
      operationId: markAppConversationRead
      summary: 更新本人话题已读序号
      description: 只允许单调前进，不能超过服务端当前 lastSequence。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationReadRequest'
      responses:
        '200':
          description: 服务端确认的已读序号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/conversations/{conversationId}/close:
    post:
      tags: [Safety, Messaging]
      operationId: closeAppConversation
      summary: 由观看者永久关闭本人的平台话题
      description: >-
        关闭后双方只能查看历史且不能重新打开；服务端追加系统消息并释放运营分配。
        重试必须复用同一个 Idempotency-Key。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已关闭话题或幂等重放结果
          content:
            application/json:
