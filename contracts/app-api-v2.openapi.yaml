          type: string
          enum: [available, planned]
        executable:
          type: boolean
        sourceTierId:
          type: [string, 'null']
        usage:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [used, remaining, resetAt]
              properties:
                used:
                  type: integer
                  minimum: 0
                remaining:
                  type: integer
                  minimum: 0
                resetAt:
                  type: [string, 'null']
                  format: date-time
    MembershipSnapshot:
